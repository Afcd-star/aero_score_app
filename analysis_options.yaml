include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    discarded_futures: error
    avoid_dynamic_calls: error
    avoid_catches_without_on_clauses: error
    strict_raw_type: error
    inference_failure_on_function_return_type: error
    inference_failure_on_function_invocation: error

    public_member_api_docs: info
    lines_longer_than_80_chars: info
    directives_ordering: warning
    always_use_package_imports: warning
    always_put_required_named_parameters_first: warning
    flutter_style_todos: warning
    eol_at_end_of_file: warning
  exclude: [build/**, "**/*.g.dart", "**/*.freezed.dart"]

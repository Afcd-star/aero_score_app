name: aero_score_app
description: "Evaluación competitiva de Gimnasia Aeróbica Deportiva."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.44.0

dependencies:
  collection: ^1.19.1 # Utilidades de colecciones
  connectivity_plus: ^7.2.0 # Conectividad
  either_dart: ^1.0.0 # Resultados tipados
  file_picker: ^8.0.0 # Selección de archivos
  fl_chart: ^1.2.0 # Gráficos
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0 # Riverpod para Flutter
  freezed_annotation: ^3.0.0 # Anotaciones de modelos
  go_router: ^17.2.3 # Enrutamiento
  google_fonts: ^8.1.0 # Tipografías
  intl: ^0.20.2 # Localización e formatos
  json_annotation: ^4.9.0 # Serialización JSON
  pocketbase: ^0.24.0 # Backend
  riverpod_annotation: ^3.0.3 # Anotaciones de estado
  shared_preferences: ^2.3.3 # Preferencias locales

dev_dependencies:
  build_runner: ^2.5.4 # Generación de código
  flutter_launcher_icons: ^0.14.4 # Iconos
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0 # Generador de modelos
  json_serializable: ^6.9.0 # Generador JSON
  mocktail: ^1.0.4 # Simulación
  riverpod_generator: ^3.0.3 # Generador de Riverpod
  riverpod_lint: ^3.0.3 # Lint de Riverpod
  very_good_analysis: ^10.2.0 # Análisis estático

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_sin_color.png
    - assets/images/logo_sin_fondo.png